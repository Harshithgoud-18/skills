<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>

<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
    <header>
    <h1>Improve Your Skills</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="register.html">Register</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>
<main>
  <div class ="body-container">
  <section class="auth-section">

  

    <!-- ===== REGISTER FORM ===== -->
    <div class="auth-form" id="registerForm">
      <h2>Register From</h2>

      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="Enter your full name" />
        <span class="error-msg" id="reg-name-error"></span>
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" placeholder="Enter your email" />
        <span class="error-msg" id="reg-email-error"></span>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="Create a password (min 6 chars)" />
        <span class="error-msg" id="reg-password-error"></span>
      </div>

      <div class="form-group">
        <label for="reg-confirm">Confirm Password</label>
        <input type="password" id="reg-confirm" placeholder="Re-enter your password" />
        <span class="error-msg" id="reg-confirm-error"></span>
      </div>

      <button class="btn-primary btn-full" onclick="validateRegister()">Register</button>
      <p class="success-msg" id="reg-success"></p>
    </div>

  </section>
  </div>
</main>
<footer>    
    <div class="footer-bottom">
        <p>© 2026 Improve Your Skills. All Rights Reserved.</p>
    </div>
</footer>
</body>
</html>
